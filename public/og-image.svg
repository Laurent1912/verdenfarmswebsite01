<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="55%" stop-color="#124a2b"/>
      <stop offset="100%" stop-color="#05210f"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#bef264" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(80,80)">
    <rect width="64" height="64" rx="16" fill="#166534" stroke="#bef264" stroke-width="2"/>
    <path d="M32 54V26" stroke="#bef264" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 36c0-8 6.4-13 13.2-13C45.2 31 38.8 36 32 36Z" fill="#bef264"/>
    <path d="M32 28c0-6.6-5.8-10.6-13.2-10.6C18.8 24 24.6 28 32 28Z" fill="#aee9c3"/>
    <text x="84" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f7f6ef">Verden Farms</text>
  </g>

  <!-- headline -->
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="#f7f6ef">Growing More Food</text>
  <text x="80" y="408" font-family="Arial, sans-serif" font-size="76" font-weight="800" fill="#bef264">in Less Space.</text>

  <text x="80" y="492" font-family="Arial, sans-serif" font-size="30" fill="#f7f6ef" opacity="0.8">Climate-smart vertical farming systems · Iringa, Tanzania</text>

  <!-- stat chips -->
  <g font-family="Arial, sans-serif" fill="#f7f6ef">
    <rect x="80" y="528" width="200" height="56" rx="28" fill="#ffffff" fill-opacity="0.08"/>
    <text x="104" y="563" font-size="22" font-weight="700">32 plants / tower</text>
    <rect x="296" y="528" width="190" height="56" rx="28" fill="#ffffff" fill-opacity="0.08"/>
    <text x="320" y="563" font-size="22" font-weight="700">95% less water</text>
    <rect x="502" y="528" width="190" height="56" rx="28" fill="#ffffff" fill-opacity="0.08"/>
    <text x="526" y="563" font-size="22" font-weight="700">2× productivity</text>
  </g>
</svg>
